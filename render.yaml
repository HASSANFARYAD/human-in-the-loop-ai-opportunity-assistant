services:
  - type: web
    name: job-assistant-api
    env: docker
    plan: free
    rootDir: backend
    healthCheckPath: /api/v1/health
    disk:
      name: job-assistant-data
      mountPath: /var/data/job-assistant
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: DEPLOYMENT_PROFILE
        value: mvp
      - key: APP_DATA_DIR
        value: /var/data/job-assistant
      - key: LOG_DIR
        value: /var/data/job-assistant/logs
      - key: FRONTEND_BASE_URL
        value: https://job-opportunity-murex.vercel.app
      - key: APP_BASE_URL
        value: https://job-opportunity-murex.vercel.app
      - key: API_PUBLIC_URL
        value: https://human-in-the-loop-ai-opportunity.onrender.com
      - key: CORS_ORIGINS
        value: https://job-opportunity-murex.vercel.app
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: BACKUP_ENABLED
        value: "true"
      - key: BACKUP_DIR
        value: /var/data/job-assistant/backups
      - key: BACKUP_INTERVAL_HOURS
        value: "24"
      - key: BACKUP_RETENTION
        value: "30"
      - key: FOLLOWUP_REMINDERS_ENABLED
        value: "true"
      - key: FOLLOWUP_AFTER_DAYS
        value: "7"
      - key: JWT_SECRET_KEY
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      # Optional offsite backups (Cloudflare R2 / S3). Set in the Render dashboard.
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_SECRET_KEY
        sync: false
      # Error monitoring (Sentry). Set the DSN in the Render dashboard to enable.
      - key: SENTRY_DSN
        sync: false
