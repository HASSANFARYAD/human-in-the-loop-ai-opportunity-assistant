[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "job-assistant-backend"
version = "1.1.0"
description = "Human-in-the-loop AI opportunity assistant backend"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
    "openai>=1.40.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "beautifulsoup4>=4.12.3",
    "requests>=2.32.0",
    "google-api-python-client>=2.137.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "pypdf>=4.3.0",
    "python-docx>=1.1.2",
    "apscheduler>=3.10.4",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pymongo>=4.7.0",
    "gunicorn>=21.0.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.1.0",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
    "python-multipart",
    "sentry-sdk[fastapi]>=2.0.0",
    "boto3>=1.34.0",
    "playwright>=1.60.0",
]

[tool.setuptools.packages.find]
include = ["job_assistant*"]
